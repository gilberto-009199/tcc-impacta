[project]
name = "teste232"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.84.0",
    "sddp-discovery-protocol (==1.5.0)",
    "upnpy (>=1.1.8,<2.0.0)",
    "rx (>=3.2.0,<4.0.0)",
    "reactivex (>=4.1.0,<5.0.0)",
    "flet-map (>=0.84.0,<0.85.0)"
]

[dependency-groups]
dev = [
    "flet-cli>=0.84.0",
    "flet-desktop>=0.84.0",
    "flet-web>=0.84.0",
]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "teste232"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
